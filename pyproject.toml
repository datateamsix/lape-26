[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lape26"
version = "0.1.0.dev0"
description = "Reference encoder for the LAPE-26 creative language-musicality research project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Michael deVry" }]
keywords = ["music", "language", "text-to-music", "creative-coding"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
lape26 = "lape26.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/lape26"]
